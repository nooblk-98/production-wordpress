services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edge_caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
      - "2019:2019"  # Prometheus metrics
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - wp_net

volumes:
  caddy_data:
  caddy_config:

networks:
  wp_net:
    external: true
    name: production-wordpress_wp_net
