services:
  db:
    image: mariadb:${MARIADB_VERSION:-10}
    container_name: wp_db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_db_user_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_db_root_password}
    volumes:
      - /opt/www/mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - wp_net

  wordpress:
    image: wordpress:php${PHP_VERSION:-8.2}-apache
    container_name: wp_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-change_me_db_user_password}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
        define('WP_MEMORY_LIMIT', '256M');
        define('AUTOMATIC_UPDATER_DISABLED', false);
    volumes:
      - /opt/www/wordpress:/var/www/html
      - ./php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./varnish-purge-plugin:/var/www/html/wp-content/plugins/varnish-purge-plugin
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - wp_net

  varnish:
    image: varnish:7.5
    container_name: wp_varnish
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    command:
      - varnishd
      - -F
      - -f
      - /etc/varnish/default.vcl
      - -s
      - malloc,512m
      - -a
      - :6081
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
    ports:
      - "8080:6081"
    networks:
      - wp_net

  ftp:
    image: atmoz/sftp:latest
    container_name: wp_sftp
    restart: unless-stopped
    environment:
      SFTP_USERS: ${SFTP_USER:-wpuser}:${SFTP_PASSWORD:-change_me_sftp_password}:33:33
    volumes:
      - /opt/www/wordpress:/home/wpuser/data
    ports:
      - "2222:22"
    networks:
      - wp_net

networks:
  wp_net:
    external: true
    name: wordpress-network