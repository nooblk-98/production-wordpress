# =========================================
# Apache MPM (Multi-Processing Module) Configuration
# Limits foreground processes to 3
# =========================================

<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          1
    MaxSpareServers          3
    MaxRequestWorkers        4
    MaxConnectionsPerChild   0
</IfModule>

<IfModule mpm_event_module>
    StartServers             2
    MinSpareServers          1
    MaxSpareServers          3
    MaxRequestWorkers        4
    MaxConnectionsPerChild   0
</IfModule>
